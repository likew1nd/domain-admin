# 域名管理系统
# 用法一：宝塔「Docker → 容器编排 → 添加」，整段粘贴即可，无需修改
# 用法二：放到任意目录执行 docker compose up -d
# 数据保存在本文件同级的 data 目录，备份该目录即可
name: domain-admin

x-update-token: &update-token ${UPDATE_TOKEN:-domain-admin-update}

services:
  app:
    image: ghcr.io/likew1nd/domain-admin:latest
    container_name: domain-admin
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8000"
    environment:
      TZ: Asia/Shanghai
      WATCHTOWER_URL: http://domain-admin-updater:8080
      WATCHTOWER_TOKEN: *update-token
    volumes:
      - ./data:/app/data
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # 在线更新：后台点击「立即更新」后，由它拉取新镜像并按原配置重建 app 容器
  updater:
    image: ghcr.io/nicholas-fedor/watchtower:1
    container_name: domain-admin-updater
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 只管理带 enable 标签的容器（即 app），不会动服务器上的其他容器
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_HTTP_API_ENDPOINTS: update,health
      WATCHTOWER_HTTP_API_TOKEN: *update-token
      WATCHTOWER_CLEANUP: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # 不映射端口：更新接口只在两个容器之间的内部网络可访问
